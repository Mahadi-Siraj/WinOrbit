# Weekly checks for outdated GitHub Actions and test packages (the app itself has no third-party packages).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns: ['*']
