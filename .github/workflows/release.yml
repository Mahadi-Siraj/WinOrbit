# Builds WinOrbit on GitHub's Windows runners and publishes a release when a version tag is pushed:
#   git tag v1.1.0 && git push origin v1.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test and build installer + portable zip
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/build-release.ps1 -Version $version

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Recurse -Include *.exe, *.zip |
            Where-Object { $_.DirectoryName -notmatch 'publish' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: WinOrbit ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifacts/installer/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
