# Builds WinOrbit on GitHub's Windows runners and publishes a GitHub release with the installer,
# the portable zip and checksums. Runs when VERSION changes on main (bump it to release), when a
# v* tag is pushed, or by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: ['VERSION']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { (Get-Content VERSION -Raw).Trim() }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building WinOrbit $v"

      - name: Test and build installer + portable zip
        shell: pwsh
        run: ./tools/build-release.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Recurse -Include *.exe, *.zip |
            Where-Object { $_.DirectoryName -notmatch 'publish' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WinOrbit ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: .github/release-notes.md
          files: |
            artifacts/installer/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
